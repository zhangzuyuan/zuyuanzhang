bio:
  - I am a Postdoc Fellow at Yale University, working with Prof. Lu Lu since November 2026.
  - My research broadly lies at the intersection of reinforcement learning, Optimization, Game Theory, Decision-making algorithms and AI for Science.
  - I received my Ph.D. in Electrical and Computer Engineering from The George Washington University, in 2026. I successfully defended my Ph.D. dissertation on September 11, 2026. During my Ph.D., I was fortunate to be advised by Prof. Tian Lan and have collaborated with researchers including Prof. Vaneet Aggarwal, Prof. Mahdi Imani, and Prof. Taeyoung Lee.
  - I received my B.Eng. in Computer Science from Taishan (Honors) College, Shandong University, in 2023.
